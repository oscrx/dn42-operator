name: BIRD image

# ghcr.io/oscrx/bird2 follows BIRD's version, not the operator's: it is
# published whenever images/bird changes on main (a Renovate BIRD or base
# image bump, after its PR passed CI), or by hand.
#
# Tags, for BIRD_TAG=v2.20.0 in images/bird/Dockerfile:
#   2.20.0            moves on a rebuild of the same BIRD (new Debian base)
#   2.20              moves to the newest BIRD 2.20.x
#   2.20.0-<commit>   never moves: this repo's commit that built it
# Deployments pin a tag plus digest, so a rebuild reaches the router only
# through a reviewed PR.

on:
  push:
    branches: [main]
    paths:
      - images/bird/**
      - .github/workflows/bird-image.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The image is the base of the integration tests: publish only a BIRD that
  # still brings up WireGuard + BGP through the VRF with the operator.
  test:
    name: Integration (VRF, WireGuard, BIRD)
    runs-on: ubuntu-latest
    # A manual run publishes too: only from main, never a feature branch.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Kernel modules
        # vrf.ko is in linux-modules-extra on the Azure kernels GitHub's
        # Ubuntu runners use; wireguard is built in.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || echo "no linux-modules-extra for $(uname -r)"
          sudo modprobe -a wireguard vrf

      - name: Integration tests
        run: make integration

  image:
    name: Build and push bird2
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed for cosign keyless signing via the GitHub OIDC provider.
      id-token: write
    env:
      IMAGE: ghcr.io/oscrx/bird2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: BIRD version
        id: bird
        run: |
          tag=$(sed -n 's/^ARG BIRD_TAG=v\([0-9][0-9.]*\)$/\1/p' images/bird/Dockerfile)
          if [ -z "$tag" ]; then
            echo "no ARG BIRD_TAG=v<version> in images/bird/Dockerfile" >&2
            exit 1
          fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$tag" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          echo "build=${tag}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.bird.outputs.version }}
            type=raw,value=${{ steps.bird.outputs.minor }}
            type=raw,value=${{ steps.bird.outputs.build }}
          labels: |
            org.opencontainers.image.version=${{ steps.bird.outputs.version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/bird
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          # No build cache: caches are writable from lower-privileged
          # workflows, so one could influence what gets signed and published.
          no-cache: true

      # Pinned to an exact release: this action publishes no floating major
      # tag, so @v4 does not resolve.
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
