name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./... && GOOS=linux go vet -tags integration ./...
      - name: Generated code is up to date
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.23.0
          make generate CONTROLLER_GEN="$(go env GOPATH)/bin/controller-gen"
          git diff --exit-code
      - name: Unit tests
        run: go test ./...

  # Real VRF, WireGuard and BIRD in a privileged container.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kernel modules
        run: sudo modprobe -a wireguard vrf
      - name: Integration tests
        run: make integration

  # Rolling update and failover on a 3-node k3s in Docker. Slow; on demand
  # and on main.
  k3s:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kernel modules
        run: sudo modprobe -a wireguard vrf
      - name: k3s test
        run: make k3s-test
