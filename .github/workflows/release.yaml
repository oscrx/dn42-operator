name: Release

on:
  push:
    tags: ["v*"]
  # Publishes moving :main tags so the latest commit is deployable without
  # cutting a release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Granted per job rather than here: with more than one job, a workflow-level
# write is handed to every job whether it needs it or not.
permissions:
  contents: read

jobs:
  # A release must never ship something that does not pass its own tests.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          # No cache. Cache entries are writable from lower-privileged
          # workflows, so restoring one here would let a pull request
          # influence what gets signed and published.
          cache: false

      - name: Test
        run: go test -race -count=1 ./...

      - name: Kernel modules
        # vrf.ko is in linux-modules-extra on the Azure kernels GitHub's
        # Ubuntu runners use; wireguard is built in.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || echo "no linux-modules-extra for $(uname -r)"
          sudo modprobe -a wireguard vrf

      - name: Integration tests
        run: make integration

  image:
    name: Build and push ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed for cosign keyless signing via the GitHub OIDC provider.
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # The operator: root, privileged on the router node.
          - name: operator
            image: ghcr.io/oscrx/dn42-operator
            context: .
            target: operator
          # The public web front end: nonroot, only the autopeer binary.
          - name: autopeer
            image: ghcr.io/oscrx/dn42-autopeer
            context: .
            target: autopeer
          # bird2 follows BIRD's version and has its own workflow
          # (bird-image.yaml).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          # No build cache: same reason as the test job.
          no-cache: true

      # Pinned to an exact release: this action publishes no floating major
      # tag, so @v4 does not resolve.
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign the image
        # Keyless signing: the identity is this workflow, so consumers can
        # verify provenance without any long-lived key material.
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Second stage: the chart pins the operator image by digest, which exists
  # only once the image is pushed. Failing here leaves a published image with
  # no chart, which a re-run fixes; the reverse would not be recoverable.
  chart:
    name: Package and push the ${{ matrix.chart }} chart
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # values: the image block's digest line (indent differs per chart).
          - chart: dn42-operator
            image: dn42-operator
            digestIndent: "    "
          - chart: dn42-autopeer
            image: dn42-autopeer
            digestIndent: "  "
    permissions:
      contents: read
      packages: write
      # Needed for cosign keyless signing via the GitHub OIDC provider.
      id-token: write
    # Only on tags: a chart version has to correspond to a release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # cosign reads ~/.docker/config.json; `helm registry login` writes
      # helm's own config, so both are needed.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to an exact release: this action publishes no floating major
      # tag, so @v4 does not resolve.
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      # The image job is a matrix, so its digest is looked up from the tag it
      # just pushed (and checked against its signature) rather than passed on.
      # Written into the working copy only: the repository keeps it empty.
      - name: Pin the published image digest into the chart
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          REPO: ${{ github.repository }}
          CHART: ${{ matrix.chart }}
          INDENT: ${{ matrix.digestIndent }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest}}' | jq -r .digest)
          test -n "$digest"
          cosign verify "${IMAGE}@${digest}" \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          values="charts/${CHART}/values.yaml"
          # Only the chart's own image digest is empty (dn42-operator also
          # pins BIRD, by tag and digest).
          sed -i "s|^${INDENT}digest: \"\"$|${INDENT}digest: \"${digest}\"|" "$values"
          grep -q "^${INDENT}digest: \"${digest}\"$" "$values"
          helm template t "charts/${CHART}" | grep -F "${IMAGE#ghcr.io/*/}@${digest}"
          echo "IMAGE_DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: Package and push the chart
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          CHART: ${{ matrix.chart }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(helm show chart "charts/${CHART}" | awk '$1=="version:"{print $2}')
          if [ "$declared" != "$version" ]; then
            echo "Chart.yaml version ($declared) does not match the tag ($version); bump the chart before tagging."
            exit 1
          fi

          helm registry login ghcr.io -u "$ACTOR" --password-stdin <<<"$GH_TOKEN"
          helm package "charts/${CHART}" --destination dist
          helm push "dist/${CHART}-${version}.tgz" \
            "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee push.log

          digest=$(grep -oE 'sha256:[a-f0-9]{64}' push.log | head -1)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${OWNER}/charts/${CHART}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        env:
          REF: ${{ steps.chart.outputs.ref }}
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "${REF}@${DIGEST}"

      - name: Summary
        env:
          CHART_REF: ${{ steps.chart.outputs.ref }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          {
            echo "### Chart ${CHART_REF##*/}"
            echo
            echo '```'
            echo "helm template dn42 oci://${CHART_REF} --version ${CHART_VERSION}"
            echo '```'
            echo
            echo "Digest: \`${CHART_DIGEST}\`"
            echo
            echo "Pins image digest \`${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Last, so a release page only appears once everything it points at exists.
  # The tag is also what the peers repo's gate installs (peercheck@<tag>).
  github-release:
    name: Create the GitHub release
    needs: [image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run after a later job failed must not trip over its own release.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes --title "$TAG"
