image:
  repository: ghcr.io/oscrx/dn42-autopeer
  # Defaults to the chart's appVersion when empty.
  tag: ""
  # Set by the release workflow to the digest of the image published for
  # this chart version, and takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The autopeer config file (YAML), rendered as-is into a ConfigMap; see
# deploy/autopeer-config.example.yaml in the dn42-operator repo. Secrets are
# files under /secrets (from existingSecret), e.g.
#   cookieKeyFile: /secrets/cookie-key
#   github.privateKeyFile: /secrets/github-app.pem
#   providers[].clientSecretFile: /secrets/<name>-client-secret
# With gitSync enabled, set registry.path: /registry-root/registry.
# kubernetes.namespace must be peersNamespace (below).
config: {}

# Secret mounted at /secrets. Not created by the chart: keep it in a
# SealedSecret or similar. Holds the cookie key, the GitHub App private key,
# client secrets and (for git-sync) the registry token.
existingSecret: dn42-autopeer

# Namespace of the DN42Peer objects (the dn42-operator release). The chart
# creates a Role there to get/list them for the status page, nothing else.
# Empty: no Role (and set config.kubernetes.enabled: false).
peersNamespace: dn42-router

# Keeps a clone of the DN42 registry fresh. Only needed for mntner claims
# (mntner -> ASNs): providers that return the ASN itself need no registry,
# so leave this off and config.registry unset. The registry needs an
# account: the token is the registry-token key of existingSecret.
gitSync:
  enabled: false
  image:
    repository: registry.k8s.io/git-sync/git-sync
    tag: v4.8.0
    pullPolicy: IfNotPresent
  repo: https://git.dn42.dev/dn42/registry.git
  # The registry account the token belongs to.
  username: ""
  period: 1h
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 256Mi}

# Rate limits live in memory, per replica: keep this at 1.
replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []

# Extra manifests, rendered with tpl (e.g. an HTTPRoute).
extraObjects: []
