# Least privilege in the release namespace; nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dn42-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dn42-operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dn42-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dn42-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [dn42.oscarr.nl]
    resources: [dn42peers]
    verbs: [get, list, watch]
  - apiGroups: [dn42.oscarr.nl]
    resources: [dn42peers/status]
    verbs: [get, patch, update]
  # The key Secret only (watched with a metadata.name field selector).
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.operator.keySecret }}]
    verbs: [get, list, watch]
  {{- with .Values.operator.endpointService }}
  # spec.ports of the floating endpoint Service, via server-side apply.
  - apiGroups: [""]
    resources: [services]
    resourceNames: [{{ . }}]
    verbs: [get, patch]
  {{- end }}
  {{- with .Values.operator.controlConfigMap }}
  # standDown and the confirmation for a blocked mass deletion.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ . }}]
    verbs: [get]
  {{- end }}
  # The leader label on the router pods (own pod, and clearing a stale
  # leader). Pod names are generated, so this can't use resourceNames.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [dn42-operator]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dn42-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dn42-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dn42-operator
subjects:
  - kind: ServiceAccount
    name: dn42-operator
    namespace: {{ .Release.Namespace }}
