---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: dn42peers.dn42.oscarr.nl
spec:
  group: dn42.oscarr.nl
  names:
    categories:
    - dn42
    kind: DN42Peer
    listKind: DN42PeerList
    plural: dn42peers
    shortNames:
    - dnp
    singular: dn42peer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.asn
      name: ASN
      type: integer
    - jsonPath: .status.listenPort
      name: Port
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    - jsonPath: .status.bgpState
      name: State
      type: string
    - jsonPath: .status.lastHandshake
      name: Handshake
      type: date
    - jsonPath: .status.routesImported
      name: Routes
      type: integer
    - jsonPath: .status.link.latency
      name: Latency
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'DN42Peer is a DN42 peering: a WireGuard tunnel and a BGP session
          in BIRD.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'DN42PeerSpec is one peer: one WireGuard link wg-<name> and
              one BGP session.'
            properties:
              asn:
                description: |-
                  ASN of the peer: DN42 (4242420000-4242429999), other networks in the
                  registry (4201000000-4201999999), private (64512-65534) or 76100-76199.
                format: int64
                type: integer
                x-kubernetes-validations:
                - message: asn must be in a DN42 range
                  rule: (self >= 4242420000 && self <= 4242429999) || (self >= 4201000000
                    && self <= 4201999999) || (self >= 64512 && self <= 65534) ||
                    (self >= 76100 && self <= 76199)
              endpoint:
                description: |-
                  Endpoint of the peer, "host:port" or "[v6]:port". Optional: without
                  it we only answer.
                maxLength: 261
                pattern: ^(\[[0-9a-fA-F:.]+\]|[0-9.]+|[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?):[0-9]{1,5}$
                type: string
              keyRef:
                description: |-
                  KeyRef is the key in the operator's key Secret holding our private
                  key for this tunnel. Without it the shared autopeer key is used.
                maxLength: 253
                pattern: ^[-._a-zA-Z0-9]+$
                type: string
              link:
                description: |-
                  Link values for the BGP communities. Optional; without them the
                  latency is measured (status.measuredLatency) and bandwidth and crypto
                  use the operator's defaults.
                properties:
                  bandwidth:
                    description: Bandwidth community, 21 (>=0.1 Mbit/s) .. 25 (>=1000
                      Mbit/s).
                    format: int32
                    maximum: 25
                    minimum: 21
                    type: integer
                  crypto:
                    description: Crypto community, 31 (none) .. 34 (encrypted with
                      PFS; WireGuard).
                    format: int32
                    maximum: 34
                    minimum: 31
                    type: integer
                  latency:
                    description: Latency community, 1 (<2.7ms) .. 9 (>2981ms).
                    format: int32
                    maximum: 9
                    minimum: 1
                    type: integer
                required:
                - bandwidth
                - crypto
                - latency
                type: object
              listenPort:
                description: |-
                  ListenPort is our UDP port for this tunnel. Default for 424242xxxx
                  ASNs: 2 followed by the last 4 digits of the ASN. Required for other
                  ASNs.
                format: int32
                maximum: 29999
                minimum: 20000
                type: integer
              localLinkLocal:
                description: LocalLinkLocal is our address on the link. Default fe80::3818.
                maxLength: 39
                pattern: ^[fF][eE][89aAbB][0-9a-fA-F]:[0-9a-fA-F:]*$
                type: string
              mtu:
                description: |-
                  MTU of the WireGuard link. Default 1420; lower it when the path to the
                  peer has extra encapsulation (e.g. 1380 behind a 6in4 tunnel).
                format: int32
                maximum: 1500
                minimum: 1280
                type: integer
              neighbor:
                description: Neighbor is the peer's link-local address, the BGP neighbor.
                maxLength: 39
                pattern: ^[fF][eE][89aAbB][0-9a-fA-F]:[0-9a-fA-F:]*$
                type: string
              publicKey:
                description: PublicKey is the peer's WireGuard public key (base64,
                  32 bytes).
                pattern: ^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$
                type: string
            required:
            - asn
            - neighbor
            - publicKey
            type: object
            x-kubernetes-validations:
            - message: localLinkLocal and neighbor must differ
              rule: '!has(self.localLinkLocal) || self.localLinkLocal != self.neighbor'
          status:
            description: DN42PeerStatus is written by the leading operator only.
            properties:
              bgpState:
                description: BGPState is the BGP state BIRD reports (Established,
                  Active, ...).
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              interface:
                description: Interface is the WireGuard link, wg-<name>.
                type: string
              lastHandshake:
                description: LastHandshake is the last WireGuard handshake.
                format: date-time
                type: string
              latencyMeasuredAt:
                description: LatencyMeasuredAt is when MeasuredLatency was measured.
                format: date-time
                type: string
              link:
                description: Link is the effective link values rendered into BIRD.
                properties:
                  bandwidth:
                    description: Bandwidth community, 21 (>=0.1 Mbit/s) .. 25 (>=1000
                      Mbit/s).
                    format: int32
                    maximum: 25
                    minimum: 21
                    type: integer
                  crypto:
                    description: Crypto community, 31 (none) .. 34 (encrypted with
                      PFS; WireGuard).
                    format: int32
                    maximum: 34
                    minimum: 31
                    type: integer
                  latency:
                    description: Latency community, 1 (<2.7ms) .. 9 (>2981ms).
                    format: int32
                    maximum: 9
                    minimum: 1
                    type: integer
                required:
                - bandwidth
                - crypto
                - latency
                type: object
              listenPort:
                description: ListenPort is the effective listen port.
                format: int32
                type: integer
              measuredLatency:
                description: |-
                  MeasuredLatency is the DN42 latency community (1..9) from the median
                  RTT of 10 pings to the endpoint, measured daily when spec.link is not
                  set. It replaces the default latency in the BIRD import/export calls.
                format: int32
                type: integer
              measuredRTT:
                description: MeasuredRTT is the median RTT behind MeasuredLatency.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status was computed
                  from.
                format: int64
                type: integer
              publicKey:
                description: |-
                  PublicKey is our WireGuard public key on this link (the shared key's,
                  or keyRef's), for showing the peer its config.
                type: string
              routesImported:
                description: RoutesImported is the number of routes imported from
                  this peer.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must match ^[a-z][a-z0-9]{0,11}$ (wg-<name> must fit in 15
            characters)
          rule: self.metadata.name.matches('^[a-z][a-z0-9]{0,11}$')
    served: true
    storage: true
    subresources:
      status: {}
