{{define "head"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AS{{.RouterASN}} autopeer</title>
<style>
:root{color-scheme:light dark;--fg:#1d1d1f;--bg:#f4f4f6;--card:#fff;--muted:#6b6b70;--line:#e2e2e7;--accent:#2457c5;--accent-fg:#fff;--bad:#b3261e;--ok:#1b7f3b;--warn:#9a6700;--btn:#343a40;--btn-hover:#1d2124}
@media (prefers-color-scheme:dark){:root{--fg:#ececf0;--bg:#111114;--card:#1b1b20;--muted:#9a9aa3;--line:#2e2e35;--accent:#8ab0ff;--accent-fg:#111114;--bad:#ff8a80;--ok:#6fd98f;--warn:#e3b341;--btn:#2b2f35;--btn-hover:#3a3f46}}
*{box-sizing:border-box}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg);margin:0}
main{max-width:52rem;margin:0 auto;padding:1.25rem 1rem 3rem}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 0 1.25rem}
header h1{font-size:1.25rem;margin:0;letter-spacing:-.01em}header h1 span{color:var(--muted);font-weight:500}
header form button{margin:0;background:transparent;color:var(--accent);padding:.25rem 0;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem}
h2{font-size:1.05rem;margin:0 0 .75rem}p{margin:.5rem 0}a{color:var(--accent)}
label{display:block;margin-top:1rem;font-weight:600;font-size:.95rem}
input,select{width:100%;padding:.55rem .65rem;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
small{color:var(--muted);display:block;margin-top:.25rem;font-size:.85rem}
button{margin-top:1.25rem;padding:.55rem 1.2rem;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button.link{background:transparent;color:var(--bad);padding:0;margin:0;font-weight:500}
pre{background:var(--bg);border:1px solid var(--line);padding:.75rem;border-radius:8px;overflow-x:auto;font-size:.85rem}
.err{color:var(--bad);font-weight:600}.muted{color:var(--muted)}
.table{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600;font-size:.85rem}
tr:last-child td{border-bottom:0}td.actions{text-align:right}td.actions a{margin-right:.75rem}
.pill{display:inline-block;padding:.05rem .55rem;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}.pill.bad{color:var(--bad);border-color:currentColor}
.providers{display:grid;gap:.6rem;max-width:22rem;margin:1rem 0 .25rem}
.login{display:flex;align-items:center;gap:.75rem;padding:.55rem .9rem;border-radius:8px;background:var(--btn);color:#fff;text-decoration:none;font-weight:500;transition:background-color .15s}
.login:hover{background:var(--btn-hover)}.login img,.login .initial{width:32px;height:32px;flex:none;border-radius:6px}
.login .initial{display:grid;place-items:center;background:#fff;color:var(--btn);font-weight:700}
form.inline{display:inline}
.primary{display:inline-block;margin-top:1rem;padding:.55rem 1.2rem;border-radius:8px;background:var(--accent);color:var(--accent-fg);text-decoration:none;font-weight:600}
</style></head><body><main>
<header><h1>AS{{.RouterASN}} <span>autopeer</span></h1>{{with .Session}}<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button>Log out {{.Identity.DisplayName}}</button></form>{{end}}</header>
{{end}}
{{define "foot"}}</main></body></html>{{end}}
