# Chart values for the k3s test: images imported locally (run.sh sets the
# repositories and tags), a test bird.conf, an init container that creates
# vrf-dn42 (Talos does that on real nodes), the endpoint Service, and a short
# status interval. The standby node is real here, so both teardown flags
# are on, as with any standby setup (the chart defaults them off).
operator:
  image:
    pullPolicy: Never
  cleanupOnShutdown: true
  teardownOnLeaseLoss: true
  endpointService: dn42-endpoint
  extraArgs: [--status-interval=5s]

bird:
  image:
    digest: ""
    pullPolicy: Never
  config:
    create: true
    content: |
      router id 10.0.0.1;
      log stderr all;
      protocol device { scan time 2; }
      function dn42_import(int lat; int bw; int crypto) -> bool { return true; }
      function dn42_export(int lat; int bw; int crypto) -> bool { return true; }
      template bgp dnpeers { vrf "vrf-dn42"; local as 4242423818; ipv6 { import table on; }; }
      include "/etc/bird/peers/*.conf";
  extraInitContainers:
    - name: vrf # Talos does this on real nodes
      image: '{{ include "dn42-operator.birdImage" . }}'
      imagePullPolicy: Never
      command: [sh, -c, "ip link show vrf-dn42 >/dev/null 2>&1 || ip link add vrf-dn42 type vrf table 42 || true; ip link set vrf-dn42 up"]
      securityContext: {privileged: true}
