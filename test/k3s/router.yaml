# Test variant of deploy/: images imported locally, a test bird.conf, an
# init container that creates vrf-dn42 (Talos does that on real nodes) and an
# IPv4 Service (the test cluster is single-stack).
apiVersion: v1
kind: ConfigMap
metadata: {name: dn42-bird-conf, namespace: dn42}
data:
  bird.conf: |
    router id 10.0.0.1;
    log stderr all;
    protocol device { scan time 2; }
    function dn42_import(int lat; int bw; int crypto) -> bool { return true; }
    function dn42_export(int lat; int bw; int crypto) -> bool { return true; }
    template bgp dnpeers { vrf "vrf-dn42"; local as 4242423818; ipv6 { import table on; }; }
    include "/etc/bird/peers/*.conf";
---
apiVersion: v1
kind: Service
metadata: {name: dn42-endpoint, namespace: dn42}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dn42-operator
    dn42.oscarr.nl/leader: "true"
  ports:
    - {name: placeholder, protocol: UDP, port: 20000}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: dn42-bird, namespace: dn42}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: dn42-bird}
  updateStrategy: {type: OnDelete}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dn42-bird}
    spec:
      nodeSelector: {dn42.oscarr.nl/router: "true"}
      hostNetwork: true
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      initContainers:
        - name: vrf # Talos does this on real nodes
          image: BIRD_IMG
          imagePullPolicy: Never
          command: [sh, -c, "ip link show vrf-dn42 >/dev/null 2>&1 || ip link add vrf-dn42 type vrf table 42 || true; ip link set vrf-dn42 up"]
          securityContext: {privileged: true}
      containers:
        - name: bird
          image: BIRD_IMG
          imagePullPolicy: Never
          command: [bird, -f, -c, /etc/bird/conf/bird.conf, -s, /var/run/bird/bird.ctl]
          securityContext: {privileged: true}
          volumeMounts:
            - {name: conf, mountPath: /etc/bird/conf, readOnly: true}
            - {name: peers, mountPath: /etc/bird/peers, readOnly: true}
            - {name: run, mountPath: /var/run/bird}
      volumes:
        - {name: conf, configMap: {name: dn42-bird-conf}}
        - {name: peers, hostPath: {path: /var/lib/dn42-router/peers, type: DirectoryOrCreate}}
        - {name: run, hostPath: {path: /var/run/bird, type: DirectoryOrCreate}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: dn42-operator, namespace: dn42}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: dn42-operator}
  updateStrategy:
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dn42-operator}
    spec:
      serviceAccountName: dn42-operator
      nodeSelector: {dn42.oscarr.nl/router: "true"}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: vrf # Talos does this on real nodes
          image: BIRD_IMG
          imagePullPolicy: Never
          command: [sh, -c, "ip link show vrf-dn42 >/dev/null 2>&1 || ip link add vrf-dn42 type vrf table 42 || true; ip link set vrf-dn42 up"]
          securityContext: {privileged: true}
      containers:
        - name: operator
          image: OPERATOR_IMG
          imagePullPolicy: Never
          args: [--endpoint-service=dn42-endpoint, --status-interval=5s, --bird-socket=/var/run/bird/bird.ctl,
                 --bird-config=/etc/bird/conf/bird.conf, --peers-dir=/etc/bird/peers]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          securityContext: {privileged: true}
          readinessProbe:
            httpGet: {path: /readyz, port: 9843}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 9843}
          volumeMounts:
            - {name: conf, mountPath: /etc/bird/conf, readOnly: true}
            - {name: peers, mountPath: /etc/bird/peers}
            - {name: run, mountPath: /var/run/bird}
      volumes:
        - {name: conf, configMap: {name: dn42-bird-conf}}
        - {name: peers, hostPath: {path: /var/lib/dn42-router/peers, type: DirectoryOrCreate}}
        - {name: run, hostPath: {path: /var/run/bird, type: DirectoryOrCreate}}
---
apiVersion: dn42.oscarr.nl/v1alpha1
kind: DN42Peer
metadata: {name: aa, namespace: dn42}
spec:
  asn: 4242420001
  publicKey: 08dzv758I5APqJizgw/W6O+FceyHSCbx/L/GZ3TL5TQ=
  neighbor: fe80::1
---
apiVersion: dn42.oscarr.nl/v1alpha1
kind: DN42Peer
metadata: {name: bb, namespace: dn42}
spec:
  asn: 4242420002
  publicKey: xAEAuM4uK5+j5kwRGIW6KYEsJVy0/6Awc4x8mpmKuSw=
  neighbor: fe80::2
