# Objects the k3s test adds next to the chart: the endpoint Service (IPv4,
# the test cluster is single-stack) and two peers.
apiVersion: v1
kind: Service
metadata: {name: dn42-endpoint, namespace: dn42}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dn42-operator
    dn42.oscarr.nl/leader: "true"
  ports:
    - {name: placeholder, protocol: UDP, port: 20000}
---
apiVersion: dn42.oscarr.nl/v1alpha1
kind: DN42Peer
metadata: {name: aa, namespace: dn42}
spec:
  asn: 4242420001
  publicKey: 08dzv758I5APqJizgw/W6O+FceyHSCbx/L/GZ3TL5TQ=
  neighbor: fe80::1
---
apiVersion: dn42.oscarr.nl/v1alpha1
kind: DN42Peer
metadata: {name: bb, namespace: dn42}
spec:
  asn: 4242420002
  publicKey: xAEAuM4uK5+j5kwRGIW6KYEsJVy0/6Awc4x8mpmKuSw=
  neighbor: fe80::2
