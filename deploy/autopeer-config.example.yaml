# Example autopeer config. Everything marked CHECK is unverified: the
# provider URLs and especially which claim carries the ASNs must be
# confirmed with each provider (and a client registered) before use.
listen: ":8080"
publicURL: https://dn42.oscarr.nl
extraPublicURLs:                         # same app on more hosts; logins use the host they started on
  - https://autopeer.oscrx.dn42          # register both callbacks with every provider
cookieKeyFile: /secrets/cookie-key       # 32 random bytes or their base64
sessionTTL: 1h
limits:
  perLoginPerHour: 3                     # PRs (requests and removals) per login
  totalPerHour: 20

router:
  asn: 4242423818
  name: oscrx
  endpointHost: "2a05:f080:0:38ff::4242" # floating LB /128 (CHECK: final IP)
  publicKey: REPLACE_WITH_SHARED_AUTOPEER_PUBLIC_KEY=
  linkLocal: fe80::3818

github:
  owner: oscrx
  repo: dn42-peers
  baseBranch: main
  peersDir: peers
  appID: 0                               # the autopeer GitHub App
  installationID: 0
  appLogin: dn42-autopeer[bot]           # the App's bot user; only its open PRs count as pending
  privateKeyFile: /secrets/github-app.pem

kubernetes:
  enabled: true                          # status page; read-only on dn42peers
  namespace: dn42-router                  # where the router chart runs (the DN42Peers)

# Links each peering to its session in a bird-lg-go looking glass
# (BIRDLG_SERVERS name as server); the .dn42 host links the .dn42 one.
lookingGlass:
  url: https://lg.dn42.oscarr.nl
  server: nl-hou01
  hostURLs:
    autopeer.oscrx.dn42: https://lg.oscrx.dn42

# Logins showing router.asn become admins: add, edit and remove peerings for
# any DN42 ASN (except router.asn itself), through the same auto-merging PRs.
# Off by default; an admin login is only as trustworthy as every provider
# that can issue one, so list the ones you trust.
admin:
  enabled: false
  providers: [iedon, kioubit]

providers:
  # Kioubit (AS4242423914), verified with a real login 2026-11-24. Register
  # a client in its control panel at https://dn42.g-load.eu/auth/oauth/;
  # public clients (PKCE, no secret) are allowed. sub is the mntner.
  - name: kioubit
    displayName: Kioubit
    # Login button icon, a data:image/ URI (e.g. the logo from Kioubit's
    # official auth button); without one the button shows a letter.
    # icon: data:image/svg+xml;base64,...
    issuer: https://dn42.g-load.eu
    clientID: CHECK
    scopes: [openid, dn42]
    claims:
      subject: sub
      asn: dn42.asn

  # OAuth.dn42 by iEdon (AS4242422189), verified with a real login
  # 2026-11-24. Self-service app registration at https://auth.iedon.net
  # (callbacks must be https there; oauth.dn42 inside DN42 allows http).
  # Confidential client. sub is an opaque hash, so show the mntner instead.
  - name: iedon
    displayName: OAuth.dn42 (iEdon)
    issuer: https://auth.iedon.net
    clientID: CHECK
    clientSecretFile: /secrets/iedon-client-secret
    scopes: [openid, dn42]
    # Logins started on the .dn42 name stay inside DN42: the same service at
    # oauth.dn42 (own issuer, same client). Its certificate is from the DN42
    # CA, so the pod must trust that root (the chart's extraCACerts).
    hostIssuers:
      autopeer.oscrx.dn42: https://oauth.dn42
    claims:
      subject: sub
      name: dn42.active_mnt
      asn: dn42.asn

  # HExpNetwork WebAuth (AS4242420298), docs at
  # https://auth42.hexpnet.work/doc.html (also https://auth.hexp.dn42),
  # discovery checked 2026-11-24. The same Auth42 software as OAuth.dn42:
  # pairwise sub (HMAC of the user and client ID), scope dn42 adds the dn42
  # claim (asn, active_mnt, route, route6, mnt_by). Discovery lists no PKCE
  # methods; autopeer sends S256 anyway. Accepts secret or public ("none")
  # clients.
  - name: hexp
    displayName: HExpNetwork WebAuth
    issuer: https://auth42.hexpnet.work
    clientID: CHECK
    clientSecretFile: /secrets/hexp-client-secret
    scopes: [openid, dn42]
    claims:
      subject: sub
      name: dn42.active_mnt
      asn: dn42.asn

  # Plain OAuth 2.0 without OIDC: the identity comes from the userinfo
  # endpoint. (No DN42 provider needs this today; "Auth42" is the software
  # behind OAuth.dn42 and HExpNetwork WebAuth, both OIDC.)
  - name: plainoauth
    displayName: Some plain OAuth provider
    authURL: https://CHECK.burble.example/authorize   # CHECK
    tokenURL: https://CHECK.burble.example/token      # CHECK
    userinfoURL: https://CHECK.burble.example/userinfo # CHECK
    clientID: CHECK
    scopes: []                                # CHECK
    claims:
      subject: sub                            # CHECK
      asn: asn                                # CHECK
