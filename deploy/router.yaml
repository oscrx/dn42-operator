# Example only; the real manifests live in uber-kubernetes.
#
# BIRD and the operator are two DaemonSets on the router nodes, not two
# containers in one pod: updating the operator (or its image) must never
# restart BIRD, because peers and the route collector back off after every
# BIRD restart. They share host paths:
#   /var/run/dn42-bird          BIRD's control socket (also for a looking glass / bird_exporter)
#   /var/lib/dn42-router/peers  the peer snippets bird.conf includes
#   /var/lib/dn42-router/conf   the bird.conf BIRD loads
# bird.conf comes from a ConfigMap with a fixed name. BIRD's pod seeds the
# shared copy from it once; after that the operator copies new ConfigMap
# versions into the shared file only after "configure check" accepts them,
# then runs "configure". Both read the same file, so BIRD never reloads a
# copy other than the one that was checked.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dn42-bird
  namespace: dn42
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: dn42-bird}
  updateStrategy:
    type: OnDelete # never restart BIRD on a manifest change; delete the pod when you mean it
  template:
    metadata:
      labels: {app.kubernetes.io/name: dn42-bird}
    spec:
      nodeSelector: {dn42.oscarr.nl/router: "true"}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      initContainers:
        # First start on a node: seed the shared bird.conf from the ConfigMap.
        # Later versions are copied by the operator, after configure check.
        - name: seed-config
          image: ghcr.io/oscrx/bird2:2.20.0
          command: [sh, -c, "[ -s /etc/bird/live/bird.conf ] || cp /etc/bird/conf/bird.conf /etc/bird/live/bird.conf"]
          volumeMounts:
            - {name: conf, mountPath: /etc/bird/conf, readOnly: true}
            - {name: live, mountPath: /etc/bird/live}
      containers:
        - name: bird
          image: ghcr.io/oscrx/bird2:2.20.0 # images/bird: BIRD 2.20.0, built from source (bird-image.yaml)
          command: [bird, -f, -c, /etc/bird/live/bird.conf, -s, /var/run/dn42-bird/bird.ctl]
          securityContext: {privileged: true}
          # Signal only (nothing routes to this pod): BIRD answers its socket.
          readinessProbe:
            exec: {command: [birdc, -s, /var/run/dn42-bird/bird.ctl, show, status]}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
          volumeMounts:
            - {name: live, mountPath: /etc/bird/live, readOnly: true}
            - {name: peers, mountPath: /etc/bird/peers, readOnly: true}
            - {name: run, mountPath: /var/run/dn42-bird}
      volumes:
        - {name: conf, configMap: {name: dn42-bird-conf}}
        - {name: live, hostPath: {path: /var/lib/dn42-router/conf, type: DirectoryOrCreate}}
        - {name: peers, hostPath: {path: /var/lib/dn42-router/peers, type: DirectoryOrCreate}}
        - {name: run, hostPath: {path: /var/run/dn42-bird, type: DirectoryOrCreate}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dn42-operator
  namespace: dn42
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: dn42-operator}
  updateStrategy:
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dn42-operator}
    spec:
      serviceAccountName: dn42-operator
      nodeSelector: {dn42.oscarr.nl/router: "true"}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      containers:
        - name: operator
          image: ghcr.io/oscrx/dn42-operator:0.1.0
          args:
            - --key-secret=dn42-wireguard-keys
            - --vrf=vrf-dn42
            - --bird-socket=/var/run/dn42-bird/bird.ctl
            - --bird-config=/etc/bird/live/bird.conf
            - --bird-config-source=/etc/bird/conf/bird.conf
            - --peers-dir=/etc/bird/peers
            # Host network: bind to the node address only, not every address.
            - --metrics-bind-address=[$(HOST_IP)]:9842
            - --health-probe-bind-address=[$(HOST_IP)]:9843
            # With one router node, keep the tunnels up across operator
            # restarts and API outages; set both true once a standby exists
            # (a tunnel key must never be live on two nodes).
            # - --cleanup-on-shutdown=false
            # - --teardown-on-lease-loss=false
            # - --endpoint-service=dn42-endpoint   # once the floating endpoint exists
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}} # leader label on its own pod
            - {name: HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
          securityContext: {privileged: true} # netlink, wireguard, /proc/sys in the host netns
          ports:
            - {name: metrics, containerPort: 9842}
          # Ready = healthy in its role with the leader label confirmed; the
          # endpoint Service selects dn42.oscarr.nl/leader=true.
          readinessProbe:
            httpGet: {path: /readyz, port: 9843}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 9843}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 64Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/bird/conf, readOnly: true}
            - {name: live, mountPath: /etc/bird/live}
            - {name: peers, mountPath: /etc/bird/peers}
            - {name: run, mountPath: /var/run/dn42-bird}
      volumes:
        - {name: conf, configMap: {name: dn42-bird-conf}}
        - {name: live, hostPath: {path: /var/lib/dn42-router/conf, type: DirectoryOrCreate}}
        - {name: peers, hostPath: {path: /var/lib/dn42-router/peers, type: DirectoryOrCreate}}
        - {name: run, hostPath: {path: /var/run/dn42-bird, type: DirectoryOrCreate}}
